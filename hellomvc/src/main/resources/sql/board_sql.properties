searchBoardAll=SELECT * FROM \
				(SELECT ROWNUM AS RNUM, B.* FROM \
					(SELECT * FROM BOARD \
						LEFT JOIN BOARD_COMMENT ON BOARD_NO=BOARD_REF \
						ORDER BY BOARD_NO DESC) B) \
				WHERE RNUM BETWEEN ? AND ?
				
boardCount=SELECT COUNT(*) FROM BOARD
searchBoardByNo=SELECT * FROM \
					(SELECT * \
						FROM BOARD LEFT JOIN BOARD_COMMENT ON BOARD_NO=BOARD_REF \
						WHERE BOARD_NO=?) \
				START WITH BOARD_COMMENT_LEVEL=1 \
				CONNECT BY PRIOR BOARD_COMMENT_NO=BOARD_COMMENT_REF


insertBoardComment=INSERT INTO BOARD_COMMENT VALUES(SEQ_BOARD_COMMENT_NO.NEXTVAL,?,?,?,?,?,DEFAULT)
searchBoardComment=SELECT * FROM BOARD_COMMENT \
					WHERE BOARD_REF=? \
					START WITH BOARD_COMMENT_LEVEL=1 \
					CONNECT BY PRIOR BOARD_COMMENT_NO=BOARD_COMMENT_REF \